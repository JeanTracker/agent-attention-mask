name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A push that lands while an earlier run is still going supersedes it: the
# suite drives real ptys and takes minutes, so queued duplicates are waste.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything, every time: the layer that needs no terminal (D-054). Two
  # seconds a job, so it is the gate that can afford to be on every push.
  fast:
    name: fast / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 tests/run_fast.py

  suite:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    # Twelve minutes a job, nearly all of it waiting on real ptys, so it runs
    # where that wall clock buys something: what has landed on master and what
    # is about to be tagged. On a pull request the contributor's machine runs
    # it instead -- CONTRIBUTING says so, and it is one command.
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # One interpreter, both kernels (D-053). The suite drives real ptys
        # for minutes a job, and the axis that has ever disagreed with itself
        # is the OS, not the Python version -- pty and termios behaviour is
        # the kernel's. README still says 3.11+; that claim is now checked by
        # hand rather than on every push.
        os: [ubuntu-latest, macos-latest]
        python: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # No install step and no cache: amask is standard library only (D-006),
      # so there is nothing to resolve.
      - name: Run the phase suites
        # The latency budgets keep their numbers; the runner declares that its
        # clock is shared, and only the budgets widen (D-049). A developer's
        # machine runs with no slack at all.
        env:
          AMASK_TEST_SLACK: "3"
        run: python3 tests/run_all.py
